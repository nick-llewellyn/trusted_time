name: ASN DB refresh

# Keeps the bundled offline IP-to-ASN snapshot
# (assets/asn/ip2asn-v{4,6}.bin.gz) current. The snapshot is a point-in-time
# iptoasn.com (PDDL) dataset generated by tool/generate_asn_db.dart. Staleness
# only degrades NTP groupId precision (never time correctness; the host
# heuristic is the floor), so a monthly cadence is sufficient.
#
# GitHub only fires `schedule:` from the default branch. This workflow lives on
# integration/bleeding-edge, so the cron trigger will not fire until the default
# branch is flipped there (a human action; main stays a pristine upstream
# mirror). workflow_dispatch works from any branch in the meantime.

on:
  schedule:
    # 04:17 UTC on the 1st of every month (off-peak; avoids top-of-hour load).
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: ASN refresh / regenerate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate ASN snapshot
        run: dart run tool/generate_asn_db.dart

      - name: Detect snapshot changes
        id: diff
        run: |
          # --porcelain catches modified, untracked, and deleted files, so a
          # generator that adds or recreates a file is not mistaken for a no-op.
          if [ -z "$(git status --porcelain -- assets/asn)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshot unchanged; no PR will be opened."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot changed:"
            git status --short -- assets/asn
          fi

      # Self-validation: GITHUB_TOKEN-opened PRs do NOT auto-trigger CI (anti-
      # recursion), so the refreshed data is validated here, in-job, before the
      # PR is opened. This is an intentional subset of CI (format, analyze,
      # test) — full CI parity (coverage, publish dry-run, example app) runs
      # once the refresh PR is merged to the trunk.
      - name: Verify formatting
        if: steps.diff.outputs.changed == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze (fatal infos)
        if: steps.diff.outputs.changed == 'true'
        run: flutter analyze --fatal-infos

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: flutter test

      - name: Open refresh PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: |
            Automated monthly refresh of the bundled offline IP-to-ASN snapshot
            (`assets/asn/ip2asn-v{4,6}.bin.gz`), regenerated by
            `tool/generate_asn_db.dart` from the iptoasn.com (PDDL) dataset.

            Staleness only degrades NTP `groupId` precision — never time
            correctness (the host heuristic remains the floor).

            Self-validated in-job (`dart format`, `flutter analyze
            --fatal-infos`, `flutter test`) because GITHUB_TOKEN-opened PRs do
            not auto-trigger CI checks.
        run: |
          # Run ID keeps same-day reruns (e.g. workflow_dispatch retries) from
          # colliding on an existing branch.
          BRANCH="automated/asn-refresh-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add assets/asn
          git commit -m 'chore(asn): refresh bundled IP-to-ASN snapshot'
          git push -u origin "$BRANCH"
          gh pr create \
            --base integration/bleeding-edge \
            --head "$BRANCH" \
            --title 'chore(asn): refresh bundled IP-to-ASN snapshot' \
            --body "$PR_BODY"
