name: trusted_time
description: Tamper-proof network time for Flutter. Anchored to hardware monotonic clocks with optional NTS (RFC 8915) to prevent system-time manipulation and network-level spoofing.
version: 2.1.0
homepage: https://github.com/Sahad2701/trusted_time
repository: https://github.com/Sahad2701/trusted_time
issue_tracker: https://github.com/Sahad2701/trusted_time/issues
documentation: https://pub.dev/documentation/trusted_time/latest/

topics:
  - time
  - ntp
  - security
  - anti-fraud
  - tamper-proof

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  nts: ^7.1.0
  flutter_secure_storage: ^10.0.0
  timezone: ">=0.9.0 <0.12.0"
  cryptography: ^2.7.0
  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
flutter:
  assets:
    # Offline IP-to-ASN snapshot (iptoasn.com, PDDL public-domain) used
    # to derive ASN-based group IDs for NTP samples. See ADR 0007 and
    # tool/generate_asn_db.dart.
    - assets/asn/
  plugin:
    platforms:
      android:
        package: com.trustedtime.trusted_time
        pluginClass: TrustedTimePlugin
      ios:
        pluginClass: TrustedTimePlugin
      macos:
        pluginClass: TrustedTimePlugin
      windows:
        pluginClass: TrustedTimePlugin
      linux:
        pluginClass: TrustedTimePlugin
